<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6D1833">
<title>Noudella</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Noudella">
<meta name="application-name" content="Noudella">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F6; --card:#FFFFFF; --ink:#30272B; --ink-2:#6E6267; --ink-3:#9A8F93;
  --primary:#6D1833; --primary-2:#8C3754; --primary-ink:#FFFFFF; --rose:#F3E5EA; --rose-2:#F8EEF1;
  --line:#ECE3E6; --line-2:#F2ECEE;
  --ok:#1E7A4F; --ok-bg:#E6F4EC; --warn:#9A6200; --warn-bg:#FCF2DF; --bad:#B42318; --bad-bg:#FDECEA;
  --info-bg:#EEF0F6; --info:#3D4A6B;
  --r:16px; --r-sm:12px; --shadow:0 1px 2px rgba(48,39,43,.05),0 8px 24px rgba(109,24,51,.06);
  --nav-h:68px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.55}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 0 calc(var(--nav-h) + var(--safe-b) + 24px)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,248,246,.92);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary);font-size:19px;letter-spacing:.2px}
.brand .mark{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block;flex:none;box-shadow:0 3px 10px rgba(140,104,40,.28)}
.wm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-size:20px;line-height:1}
.topbar h1{font-size:19px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + var(--safe-b));height:calc(var(--nav-h) + var(--safe-b))}
.bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-3);border-radius:12px;padding:4px 0;cursor:pointer;font-weight:500}
.bottomnav button.on{color:var(--primary)}
.bottomnav button.on .pill{background:var(--rose)}
.bottomnav .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;width:250px;flex:none;position:sticky;top:0;height:100vh;background:#fff;border-left:1px solid var(--line);padding:22px 14px}
  .side .brand{padding:4px 10px 26px;font-size:21px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:12px;font-size:16px;color:var(--ink-2);cursor:pointer;text-align:right;font-weight:500}
  .side nav button:hover{background:var(--rose-2);color:var(--primary)}
  .side nav button.on{background:var(--rose);color:var(--primary);font-weight:600}
  .side .foot{margin-top:auto;font-size:12.5px;color:var(--ink-3);padding:10px}
  .bottomnav{display:none}
  .main{padding-bottom:40px}
  .topbar .brand{display:none}
  .wrap{padding:24px 28px}
}

/* ---------- elements ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line-2)}
.pad{padding:16px}
.sect{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sect h2{font-size:17px;margin:0;font-weight:700}
.sect .grow{flex:1}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:13.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:15.5px;cursor:pointer;transition:transform .08s,background .15s,opacity .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(109,24,51,.22)}
.btn-primary:hover{background:#5d1229}
.btn-soft{background:var(--rose);color:var(--primary)}
.btn-soft:hover{background:#EED8E0}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:#DCCDD2}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn:hover{color:var(--primary);border-color:#DCCDD2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink-2);font-weight:500}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}.b-rose{background:var(--rose);color:var(--primary)}.b-gray{background:#F1EDEE;color:var(--ink-2)}
.search{position:relative;flex:1}
.search input{padding-right:42px}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:14px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.inp,select.inp,textarea.inp{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:0 14px;outline:none;transition:border .15s,box-shadow .15s;font-size:16px}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(140,55,84,.12)}
.inp[readonly],.inp:disabled{background:#F7F3F4;color:var(--ink-2)}
.inp.ltr{direction:ltr;text-align:right}
.combo{display:flex;gap:8px}
.combo>*{min-width:0}
.combo .inp.unit{flex:0 0 120px}
.seg{display:flex;background:#F3EEF0;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;border:0;background:none;border-radius:9px;height:40px;padding:0 10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.callout{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.callout.info{background:var(--rose-2);color:var(--primary)}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.ok{background:var(--ok-bg);color:var(--ok)}

/* KPI */
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;font-weight:500}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.3px}
.kpi .sub{font-size:12.5px;color:var(--ink-3)}
.kpi.hero{background:linear-gradient(150deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff;border:0}
.kpi.hero .lbl,.kpi.hero .sub{color:rgba(255,255,255,.82)}
.ico-dot{width:30px;height:30px;border-radius:10px;background:var(--rose);color:var(--primary);display:grid;place-items:center}
.kpi.hero .ico-dot{background:rgba(255,255,255,.16);color:#fff}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{border:1px solid var(--line-2);background:#fff;border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.quick button span.ic{width:44px;height:44px;border-radius:14px;background:var(--rose);color:var(--primary);display:grid;place-items:center}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li:hover{background:#FDFBFB}
.li .main-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow{flex:1;min-width:0}
.li .end{text-align:left;flex:none}
.avatar{width:44px;height:44px;border-radius:13px;background:var(--rose);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none;font-size:17px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.empty .big{width:58px;height:58px;border-radius:18px;background:var(--rose);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(48,39,43,.05),0 14px 30px rgba(109,24,51,.1)}
.pimg{aspect-ratio:4/3;background:linear-gradient(150deg,#F3E5EA,#E9CFD9);display:grid;place-items:center;color:var(--primary);font-size:38px;font-weight:700;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .flag{position:absolute;top:8px;right:8px}
.pbody{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-weight:700;font-size:15.5px;line-height:1.35}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.pprice{font-weight:700;color:var(--ink);font-size:15px}

/* detail */
.hero-head{display:flex;gap:14px;align-items:center}
.hero-img{width:84px;height:84px;border-radius:20px;overflow:hidden;background:linear-gradient(150deg,#F3E5EA,#E9CFD9);display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--primary);flex:none}
.hero-img img{width:100%;height:100%;object-fit:cover}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;background:var(--rose-2);min-width:0}
.stat .l{font-size:12.5px;color:var(--ink-2)}
.stat .v{font-size:19px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar .track{height:9px;border-radius:9px;background:#F3EEF0;overflow:hidden}
.bar .fill{height:100%;border-radius:9px;background:var(--primary)}
.bar .fill.c2{background:var(--primary-2)}.bar .fill.c3{background:#C27C95}.bar .fill.c4{background:#D9AEBD}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:600;color:var(--ink-2);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:left}
.tscroll{overflow-x:auto}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px;gap:10px}
.kv:last-child{border-bottom:0}
.kv.total{font-weight:700;font-size:17px;border-bottom:0;padding-top:12px}
.kv.big .num{font-size:20px}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* order editor */
.oline{display:grid;grid-template-columns:1fr;gap:8px;padding:14px;border-bottom:1px solid var(--line-2)}
.oline:last-child{border-bottom:0}
.oline .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.oline .calc{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;height:48px;overflow:hidden;background:#fff}
.stepper button{width:42px;height:100%;border:0;background:#FBF8F9;font-size:20px;cursor:pointer;color:var(--primary);flex:none}
.stepper input{border:0;height:100%;width:100%;min-width:0;text-align:center;outline:none;font-weight:600;direction:ltr}
.split{display:grid;gap:16px}
@media (min-width:960px){.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.sticky{position:sticky;top:84px}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(36,20,27,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.sheet-h h3{margin:0;font-size:18px;flex:1}
.sheet-b{padding:8px 18px 12px;overflow-y:auto}
.sheet-f{padding:12px 18px 16px;border-top:1px solid var(--line-2);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.grab{width:42px;height:5px;border-radius:5px;background:#E2D6DA;margin:8px auto 0}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:86vh}.grab{display:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast & loader */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
@media (min-width:960px){.toasts{bottom:24px}}
.toast{background:#2B2226;color:#fff;border-radius:14px;padding:12px 16px;font-size:14.5px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .2s}
.toast.err{background:#8E1B12}
.toast.ok svg{color:#7FD8A8}
.busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden;display:none}
.busybar.on{display:block}
.busybar:before{content:"";position:absolute;inset:0;width:40%;background:var(--primary-2);animation:slide 1s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.splash .logo{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 16px;box-shadow:0 14px 34px rgba(140,104,40,.28);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(.94)}}
.skel{background:linear-gradient(90deg,#F1EBED 25%,#F8F4F5 37%,#F1EBED 63%);background-size:400% 100%;animation:sk 1.4s infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.hide{display:none!important}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.wrap-text{white-space:normal}
.link{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:0;font-size:inherit}
.fab{position:fixed;left:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:25;height:56px;border-radius:18px;padding:0 20px;box-shadow:0 10px 26px rgba(109,24,51,.35)}
@media (min-width:960px){.fab{display:none}}
.avatar,.hero-img{position:relative;overflow:hidden}
.avatar img,.hero-img img,.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* invoice */
.inv-wrap{max-width:640px;margin:0 auto}
.inv-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media (min-width:720px){.inv-actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
.inv-actions .wa{grid-column:1/-1;background:#1FA855;color:#fff;box-shadow:0 4px 14px rgba(31,168,85,.28);height:52px;font-size:16px}
.inv-actions .wa:hover{background:#178F47}
.stock-pill{position:absolute;bottom:8px;right:8px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 11px 4px 9px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stock-pill .num{font-size:15px}
.stock-pill.ok{color:var(--ok)}.stock-pill.out{color:var(--bad)}
.stockbox{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;border-radius:16px;border:1.5px solid}
.stockbox.ok{background:var(--ok-bg);border-color:#BFE3CF;color:var(--ok)}
.stockbox.out{background:var(--bad-bg);border-color:#F5C6C1;color:var(--bad)}
.stockbox .big{font-size:44px;font-weight:700;line-height:1;min-width:56px;text-align:center}
.stockbox .lbl{flex:1;min-width:0}.stockbox .lbl b{display:block;font-size:17px}.stockbox .lbl span{font-size:13px;opacity:.85}
.stockbox .btn{flex:none}
.inv-actions .btn{padding:0 8px;font-size:14px}
.invoice{position:relative;background:#fff;border-radius:18px;box-shadow:var(--shadow);border:1px solid #F0E6D8;padding:26px 24px 20px;overflow:hidden;color:#30272B}
.invoice .gold{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#C9A24B,#EAD79F,#C9A24B)}
.inv-head{display:flex;align-items:center;gap:14px}
.inv-logo{width:82px;height:82px;border-radius:50%;flex:none;display:block}
.inv-brand{flex:1;min-width:0}
.inv-brand .wm{font-size:24px}
.inv-brand .t{font-size:14px;color:var(--ink-2);margin-top:6px;font-weight:600}
.stamp{flex:none;transform:rotate(-12deg);border:3px solid currentColor;border-radius:14px;padding:7px 14px 6px;text-align:center;line-height:1.2;opacity:.9;position:relative}
.stamp i{position:absolute;inset:3px;border:1.5px solid currentColor;border-radius:9px}
.stamp b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;letter-spacing:.12em}
.stamp span{display:block;font-size:13px;font-weight:700}
.s-draft{color:#8A8086}.s-confirmed{color:#6D1833}.s-delivered{color:#1E7A4F}.s-cancelled{color:#B42318}

};
function ic(n, cls) { return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }

  if (v === null || v === undefined || v === '') return 0;

    .replace(/[٫]/g, '.').replace(/[,٬\s]/g, '');

  var x = Number(s); return isFinite(x) ? x : NaN;
}
function fmt(v, d) { var x = n(v); d = d === undefined ? 2 : d; return x.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: d }); }

function cur() { return (S.data && S.data.settings && S.data.settings.currency) || 'ج.م'; }

function qtyText(q, base) {

/* ======================= server ======================= */
/* Connection settings come from the owner's private link: #d=<deployment id>&k=<key>.
   They are remembered on this device so the home-screen icon keeps working. */
var CFG = (function () {
  var h = {}, saved = {};
  String(location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ''); });
  try { saved = JSON.parse(localStorage.getItem('noudella_cfg') || '{}') || {}; } catch (e) { saved = {}; }
  var c = { d: h.d || saved.d || '', k: h.k || saved.k || '' };
  if (!/^[A-Za-z0-9_-]{20,}$/.test(c.d) || !/^[A-Za-z0-9]{20,}$/.test(c.k)) return null;
  try { localStorage.setItem('noudella_cfg', JSON.stringify(c)); } catch (e) {}

})();
function api(action, payload, requestId) {
  if (!CFG) return Promise.reject(new Error('افتح السيستم من الرابط الخاص بيك'));
  var body = JSON.stringify({ k: CFG.k, action: action, payload: payload || {}, requestId: requestId || rid() });

    method: 'POST', body: body, credentials: 'omit', redirect: 'follow', cache: 'no-store',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }

    });

function setBusy(on) { S.busy = on; document.getElementById('busybar').classList.toggle('on', !!on); }
/** Run a write action once; button disabled while running; same requestId on retry = no duplicates. */
function run(action, payload, opts) {
  opts = opts || {};
  if (S.busy) return Promise.resolve(null);
  setBusy(true);
  var btns = document.querySelectorAll('[data-lockable]'); btns.forEach(function (b) { b.disabled = true; });
  return api(action, payload, opts.rid).then(function (res) {
    setBusy(false); btns.forEach(function (b) { b.disabled = false; });
    if (opts.ok) toast(opts.ok, 'ok');
    if (res.duplicate) toast('العملية دي اتسجلت قبل كده — مش هتتكرر', 'ok');
    return res;
  }).catch(function (e) {
    setBusy(false); btns.forEach(function (b) { b.disabled = false; });
    toast(e.message, 'err'); if (opts.onErr) opts.onErr(e); return null;
  });
}
function toast(msg, kind) {
  var box = document.getElementById('toasts'), el = document.createElement('div');

  box.appendChild(el); setTimeout(function () { el.remove(); }, kind === 'err' ? 6000 : 3200);

VIEWS.dashboard = function () {
  var d = S.data, name = (d.settings || {}).business_name || 'Noudella';

function resizeImage(file, max, cb) {
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { cb(null); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

  revPurchase: function (el) {
    var id = el.getAttribute('data-p');
    confirmBox('إلغاء عملية الشراء', 'الكمية هتتشال من الرصيد والمتوسط يرجع زي ما كان. ده متاح بس لو مفيش حركة اتعملت على الخامة بعد الشراء ده.', 'إلغاء الشراء', true)
      .then(function (y) { if (y) run('reversePurchase', { id: id }, { ok: 'تم إلغاء الشراء' }).then(function (r) { if (r) render(); }); });
  },
  saveProduction: function () {
    var q = parseIn(val('pr_qty'));
    if (!val('pr_prod')) return toast('اختار المنتج', 'err');
    if (!(q > 0) || Math.floor(q) !== q) return toast('اكتب عدد قطع صحيح', 'err');
    var p = prodById(val('pr_prod'));
    confirmBox('تأكيد الإنتاج', 'هيتم خصم خامات ' + fmt(q) + ' قطعة من "' + esc(p.name) + '" من المخزن.', 'تسجيل').then(function (y) {
      if (!y) return;
      run('recordProduction', { product_id: p.id, qty: q, date: val('pr_date'), notes: val('pr_notes') }, { rid: S.pr.rid, ok: 'تم تسجيل الإنتاج' })
        .then(function (r) { if (r) go('production'); });
    });
  },
  revProduction: function (el) {
    var id = el.getAttribute('data-p');
    confirmBox('إلغاء دفعة الإنتاج', 'الخامات هترجع للمخزن ورصيد المنتج الجاهز هيقل.', 'إلغاء الدفعة', true)
      .then(function (y) { if (y) run('reverseProduction', { id: id }, { ok: 'تم إلغاء الدفعة' }).then(function (r) { if (r) render(); }); });
  },
  newOrder: function () { startOrder(null); },
  openOrder: function (el) { go('order', el.getAttribute('data-p')); },
  ordEdit: function (el) { startOrder(S.data.orders.find(function (o) { return o.id === el.getAttribute('data-p'); })); },
  odAddLine: function () {
    odCollect();
    S.draft.lines.push({ product_id: '', qty: 1, unit_price: '' }); render();
    var sels = document.querySelectorAll('select[data-od-line]'); if (sels.length) sels[sels.length - 1].focus();
  },
  odDelLine: function (el) { odCollect(); S.draft.lines.splice(+el.getAttribute('data-i'), 1); render(); },
  odStep: function (el) {
    odCollect(); var l = S.draft.lines[+el.getAttribute('data-i')];
    l.qty = Math.max(1, (parseIn(l.qty) || 0) + (+el.getAttribute('data-d')));
    var inp = document.querySelector('input[data-od-line="' + el.getAttribute('data-i') + '"][data-f="qty"]'); if (inp) inp.value = l.qty;
    odCalc();
  },
  odAddExtra: function () { odCollect(); S.draft.extras.push({ label: '', amount: '' }); render(); },
  odDelExtra: function (el) { odCollect(); S.draft.extras.splice(+el.getAttribute('data-i'), 1); render(); },
  odSave: function () {
    var pl = odPayload(false); if (!pl) return;
    run('saveOrder', pl, { rid: S.draft.rid, ok: 'تم حفظ الطلب كمسودة' }).then(function (r) { if (r) { S.draft = null; go('invoice', r.result.id); } });
  },
  odConfirm: function () {
    var pl = odPayload(true); if (!pl) return;
    var d = S.draft;
    confirmFlow(pl.lines, function (produce) {
      pl.produce = produce;
      run('saveOrder', pl, { rid: d.rid }).then(function (r) {
        if (!r) return;
        S.draft = null;
        if (r.result.confirmError) toast('اتحفظ كمسودة بس متأكدش: ' + r.result.confirmError, 'err'); else toast(produce ? 'اتنتج الناقص واتأكد الطلب' : 'تم تأكيد الطلب', 'ok');
        go('invoice', r.result.id);
      });
    });
  },
  ordConfirm: function (el) {
    var id = el.getAttribute('data-p'), o = S.data.orders.find(function (x) { return x.id === id; }), r0 = rid();
    confirmFlow(o.lines, function (produce) {
      run('confirmOrder', { id: id, produce: produce }, { rid: r0, ok: produce ? 'اتنتج الناقص واتأكد الطلب' : 'تم تأكيد الطلب' }).then(function (r) { if (r) go('invoice', id); });
    });
  },
  ordStatus2: function (el) {
    var id = el.getAttribute('data-p'), s = el.getAttribute('data-s'), r0 = rid();
    var o = S.data.orders.find(function (x) { return x.id === id; });
    var back = o && (o.status === 'confirmed' || o.status === 'delivered') ? ' القطع هترجع مخزن المنتجات.' : '';
    var txt = { delivered: ['تم التسليم', 'هيتسجل إن الطلب اتسلم للعميل.', 'تم التسليم', false],
      cancelled: ['إلغاء الطلب', 'الطلب هيتلغي ومش هيتحسب في الأرباح، والفاتورة هتاخد ختم CANCELLED.' + back, 'إلغاء الطلب', true],
      draft: ['رجوع لمسودة', 'التكلفة المثبتة هتتشال والطلب هيتحسب تاني بأسعار النهارده لما تأكده.' + back, 'رجوع لمسودة', true] }[s];
    confirmBox(txt[0], txt[1], txt[2], txt[3]).then(function (y) { if (y) run('setOrderStatus', { id: id, status: s }, { rid: r0, ok: 'تم' }).then(function (r) { if (r) { if (s === 'cancelled') go('invoice', id); else render(); } }); });
  },
  invPrint: function () { window.print(); },
  invWhatsApp: function (el) {
    var o = S.data.orders.find(function (x) { return x.id === el.getAttribute('data-p'); });
    if (!o.customer_phone) { toast('ضيف رقم تليفون العميل في الطلب الأول', 'err'); startOrder(o); return; }
    if (waNumber(o.customer_phone).length < 8) { toast('رقم التليفون مش واضح، راجعه في الطلب', 'err'); return; }
    if (o.invoice_url && o.invoice_status === o.status) { window.open(waLink(o, o.invoice_url), '_blank'); return; }
    var r0 = rid();
    invoicePdf().then(function (pdf) {
      return run('saveInvoicePdf', { order_id: o.id, data: pdf.b64 }, { rid: r0 });
    }).then(function (r) {
      if (!r) return;
      var o2 = S.data.orders.find(function (x) { return x.id === o.id; }) || o, link = waLink(o2, r.result.url);
      var win = window.open(link, '_blank');
      if (!win) modal({ title: 'الفاتورة جاهزة', body: '<div class="callout ok">' + ic('check', 'sm') + '<div>الـ PDF اترفع. اضغط الزرار وهيفتح واتساب على رقم العميل والرسالة جاهزة — اضغط إرسال بس.</div></div>',
        footer: '<a class="btn wa" style="flex:1;background:#1FA855;color:#fff" target="_blank" rel="noopener" href="' + esc(link) + '" onclick="setTimeout(closeModal,300)">' + WA_ICON + 'افتح واتساب</a>' });
    }).catch(function (e) { toast(e.message, 'err'); });
  },
  invPdf: function (el) {
    var o = S.data.orders.find(function (x) { return x.id === el.getAttribute('data-p'); });
    invoicePdf().then(function (pdf) { downloadBlob(pdf.blob, 'Noudella-' + o.order_no + '.pdf'); toast('اتحفظ ملف PDF', 'ok'); }).catch(function (e) { toast(e.message, 'err'); });
  },
  invSave: function (el) {
    var o = S.data.orders.find(function (x) { return x.id === el.getAttribute('data-p'); });
    invoiceBlob().then(function (b) { downloadBlob(b, 'Noudella-' + o.order_no + '.png'); toast('اتحفظت صورة الفاتورة', 'ok'); }).catch(function (e) { toast(e.message, 'err'); });
  },
  invShare: function (el) {
    var o = S.data.orders.find(function (x) { return x.id === el.getAttribute('data-p'); }), name = 'Noudella-' + o.order_no + '.pdf';
    invoicePdf().then(function (pdf) {
      var b = pdf.blob, file = new File([b], name, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: 'Noudella ' + o.order_no }).catch(function () {});
      downloadBlob(b, name); toast('المشاركة مش متاحة هنا — اتحفظت الصورة بدلها', 'ok');
    }).catch(function (e) { toast(e.message, 'err'); });
  },
  saveSettings: function () {
    var m = parseIn(val('st_margin')); if (m === '' || isNaN(m) || m < 0 || m >= 95) return toast('الهامش لازم يكون بين 0 و 95', 'err');
    run('saveSettings', { business_name: val('st_name'), target_margin: m }, { rid: S.st.rid, ok: 'تم الحفظ' }).then(function (r) { if (r) { S.st.rid = rid(); render(); } });
  },
  backupNow: function () { run('backupNow', {}, { rid: rid() }).then(function (r) { if (r && r.result) toast(r.result.message, 'ok'); }); }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = ACT[el.getAttribute('data-act')]; if (!a) return;
  if (el.disabled) return;
  e.preventDefault(); a(el, e);
});
document.addEventListener('input', function (e) {
  var t = e.target, live = t.getAttribute('data-live');
  if (live === 'prodQ') { S.filters.prodQ = t.value; softRender('prodQ'); }
  else if (live === 'matQ') { S.filters.matQ = t.value; softRender('matQ'); }
  else if (live === 'ordQ') { S.filters.ordQ = t.value; softRender('ordQ'); }
  else if (live === 'rl') rlPreview();
  else if (live === 'mf') mfPreview();
  else if (live === 'pu') puPreview();
  else if (live === 'pr') prPreview();
  else if (live === 'od' || t.hasAttribute('data-od-line') || t.hasAttribute('data-od-extra')) { odCollect(); odCalc(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'rl_mat') { rlUnits(); rlPreview(); }
  else if (t.id === 'pu_mat') puSync();
  else if (t.id === 'pr_prod') prPreview();
  else if (t.hasAttribute('data-od-line') && t.getAttribute('data-f') === 'product_id') {
    odCollect(); var l = S.draft.lines[+t.getAttribute('data-od-line')], p = prodById(t.value);
    if (p && (l.unit_price === '' || l.unit_price === null || l.unit_price === undefined || l._auto)) { l.unit_price = n(p.selling_price); l._auto = true; }
    render();
  }
  else if (t.hasAttribute('data-od-line') && t.getAttribute('data-f') === 'unit_price') { var ln = S.draft.lines[+t.getAttribute('data-od-line')]; if (ln) ln._auto = false; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.modal) closeModal(); });
function softRender(focusId) {
  var el = document.getElementById(focusId), pos = el ? el.selectionStart : null;
  render();
  var el2 = document.getElementById(focusId); if (el2) { el2.focus(); try { el2.setSelectionRange(pos, pos); } catch (x) {} }
}

/* ======================= start ======================= */
function boot() {
  api('bootstrap').then(function () {
    document.getElementById('splash').remove();
    render();
  }).catch(function (e) {
    document.getElementById('splash').innerHTML = '<div style="text-align:center;padding:24px"><img class="logo" src="logo-full.png" alt="" style="animation:none"><div style="font-weight:700">تعذر تحميل البيانات</div><div class="faint">' + esc(e.message) + '</div><button class="btn btn-primary mt" onclick="location.reload()">إعادة المحاولة</button></div>';
  });
}
boot();
</script>
</body>
</html>
